name: Build macOS installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - name: Verify disk images
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            image=(release/Graduation\ Memories-*-mac-"$arch".dmg)
            test -f "${image[0]}"
            hdiutil verify "${image[0]}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Graduation-Memories-macOS
          path: release/*.dmg
          if-no-files-found: error

